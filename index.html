<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06402B">

<title>Contabilidad · Alcaldía de Flandes</title>

<!-- Las fuentes del kit (IBM Plex Sans y Sora). display=swap: el texto se
     ve desde el primer instante aunque la fuente llegue después. -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="manifest" href="manifest.json">
<!-- El icono es el escudo de CONTABILIDAD APP-DIGITAL que entregó Oss (23/09/2026).
     El de 32 va en la pestaña; el de 180 va SIN transparencia porque iOS
     pinta de negro lo transparente. -->
<link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icono-180.png">

<!-- El kit primero: base.css define los colores de los dos temas -->
